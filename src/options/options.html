<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-i18n="opt_title">Acousmos Captions — Settings</title>
  <link rel="stylesheet" href="options.css" />
</head>
<body>
  <main class="wrap">
    <header class="head">
      <img src="icons/icon48.png" alt="" width="36" height="36" />
      <div>
        <h1>Acousmos Captions</h1>
        <p class="sub" data-i18n="opt_keys_note"></p>
      </div>
    </header>

    <section class="card">
      <h2 data-i18n="opt_asr_section"></h2>
      <div class="row">
        <label data-i18n="opt_provider"></label>
        <select id="asr-provider">
          <option value="soniox">Soniox (v5)</option>
          <option value="deepgram">Deepgram (nova-3)</option>
        </select>
      </div>
      <div class="row" id="row-deepgram-key">
        <label data-i18n="opt_api_key"></label>
        <div class="keyline">
          <input id="deepgram-key" type="password" autocomplete="off" spellcheck="false" placeholder="dg_…" />
          <button id="test-deepgram" class="btn" data-i18n="opt_test_key"></button>
        </div>
      </div>
      <div class="row" id="row-soniox-key">
        <label data-i18n="opt_api_key"></label>
        <div class="keyline">
          <input id="soniox-key" type="password" autocomplete="off" spellcheck="false" placeholder="soniox key" />
          <button id="test-soniox" class="btn" data-i18n="opt_test_key"></button>
        </div>
      </div>
      <div class="row">
        <label data-i18n="opt_source_lang"></label>
        <select id="source-lang">
          <option value="auto" data-i18n="opt_lang_auto"></option>
          <option value="en">English</option>
          <option value="zh">中文</option>
          <option value="ja">日本語</option>
          <option value="ko">한국어</option>
          <option value="es">Español</option>
          <option value="fr">Français</option>
          <option value="de">Deutsch</option>
          <option value="ru">Русский</option>
          <option value="pt">Português</option>
        </select>
      </div>
      <div class="row row-top">
        <label data-i18n="opt_custom_terms"></label>
        <textarea id="custom-terms" rows="2" spellcheck="false" data-i18n-ph="opt_custom_terms_ph"></textarea>
      </div>
    </section>

    <section class="card">
      <h2 data-i18n="opt_llm_section"></h2>
      <div class="row">
        <label data-i18n="opt_provider"></label>
        <select id="llm-provider">
          <option value="openai">OpenAI-compatible</option>
          <option value="anthropic">Anthropic (Claude)</option>
        </select>
      </div>
      <div id="openai-fields">
        <div class="row">
          <label data-i18n="opt_base_url"></label>
          <input id="openai-base" type="text" spellcheck="false" placeholder="https://api.openai.com/v1" />
        </div>
        <div class="row hidden" id="row-grant">
          <label></label>
          <button id="grant-origin" class="btn" data-i18n="opt_grant_origin"></button>
        </div>
        <div class="row">
          <label data-i18n="opt_model"></label>
          <input id="openai-model" type="text" spellcheck="false" placeholder="gpt-4.1-mini" />
        </div>
        <div class="row">
          <label data-i18n="opt_api_key"></label>
          <div class="keyline">
            <input id="openai-key" type="password" autocomplete="off" spellcheck="false" placeholder="sk-…" />
            <button id="test-openai" class="btn" data-i18n="opt_test_key"></button>
          </div>
        </div>
      </div>
      <div id="anthropic-fields" class="hidden">
        <div class="row">
          <label data-i18n="opt_model"></label>
          <input id="anthropic-model" type="text" spellcheck="false" placeholder="claude-haiku-4-5" />
        </div>
        <div class="row">
          <label data-i18n="opt_api_key"></label>
          <div class="keyline">
            <input id="anthropic-key" type="password" autocomplete="off" spellcheck="false" placeholder="sk-ant-…" />
            <button id="test-anthropic" class="btn" data-i18n="opt_test_key"></button>
          </div>
        </div>
      </div>
      <div class="row">
        <label data-i18n="opt_target_lang"></label>
        <select id="target-lang">
          <option value="zh-CN">简体中文</option>
          <option value="zh-TW">繁體中文</option>
          <option value="en">English</option>
          <option value="ja">日本語</option>
          <option value="ko">한국어</option>
          <option value="es">Español</option>
          <option value="fr">Français</option>
          <option value="de">Deutsch</option>
        </select>
      </div>
    </section>

    <section class="card">
      <h2 data-i18n="opt_display_section"></h2>
      <div class="row">
        <label data-i18n="opt_mode"></label>
        <select id="mode">
          <option value="bilingual" data-i18n="opt_mode_bilingual"></option>
          <option value="source" data-i18n="opt_mode_source"></option>
          <option value="target" data-i18n="opt_mode_target"></option>
        </select>
      </div>
      <div class="row">
        <label data-i18n="opt_order"></label>
        <select id="order">
          <option value="src" data-i18n="opt_order_src_first"></option>
          <option value="tgt" data-i18n="opt_order_tgt_first"></option>
        </select>
      </div>
      <div class="row">
        <label data-i18n="opt_src_size"></label>
        <span class="val val-min">50%</span>
        <input id="src-scale" type="range" min="0.5" max="1.6" step="0.05" />
        <span id="src-scale-val" class="val"></span>
      </div>
      <div class="row">
        <label data-i18n="opt_tgt_size"></label>
        <span class="val val-min">50%</span>
        <input id="tgt-scale" type="range" min="0.5" max="1.6" step="0.05" />
        <span id="tgt-scale-val" class="val"></span>
      </div>
      <div class="row">
        <label data-i18n="opt_bg_opacity"></label>
        <span class="val val-min">0%</span>
        <input id="bg-opacity" type="range" min="0" max="0.9" step="0.05" />
        <span id="bg-opacity-val" class="val"></span>
      </div>
    </section>

    <section class="card">
      <h2 data-i18n="opt_data_section"></h2>
      <div class="row">
        <button id="clear-cache" class="btn btn-danger" data-i18n="opt_clear_cache"></button>
      </div>
    </section>

    <footer class="foot">
      <span id="status"></span>
      <span class="ver" id="version"></span>
    </footer>
  </main>
  <script src="options.js"></script>
</body>
</html>
