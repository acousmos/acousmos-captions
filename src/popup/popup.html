<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title data-i18n="popup_title">Acousmos Captions</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main class="pop">
    <header class="head">
      <img src="icons/icon32.png" alt="" width="24" height="24" />
      <strong data-i18n="popup_title"></strong>
      <span class="ver" id="version"></span>
    </header>
    <p id="hint" class="hint"></p>
    <label class="toggle">
      <input type="checkbox" id="enabled" />
      <span data-i18n="menu_show"></span>
    </label>
    <button id="open-options" class="btn" data-i18n="popup_open_options"></button>
  </main>
  <script src="popup.js"></script>
</body>
</html>
